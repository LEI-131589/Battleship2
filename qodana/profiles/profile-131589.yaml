name: "God Class Profile"
baseProfile: empty
inspections:
  - inspection: OverlyComplexClass
    enabled: true
    severity: WARNING
    options:
      m_limit: 10 # Limite de Weighted Methods per Class (WMC)
  - inspection: ClassWithTooManyMethods
    severity: WARNING
    enabled: true
    options:
      m_limit: 5 # Limite para Number of Methods (NOM)
  - inspection: ClassWithTooManyFields
    enabled: true
    severity: WARNING
    options:
      m_limit: 5 # Limite para Number of Attributes (NOA)