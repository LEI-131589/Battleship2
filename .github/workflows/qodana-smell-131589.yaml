#131589 - Gonçalo Gonçalves
name: Qodana smell gate 131589
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  checks: write
  pull-requests: write
jobs:
  qodana-131589:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Onde esta o ficheiro?
        run: |
          find . -name "GodClassEnorme.java"
          find . -name "pom.xml" -not -path "./node_modules/*"

      - uses: JetBrains/qodana-action@v2026.2
        with:
          args: --config qodana-131589.yaml --print-problems
          pr-mode: false
          upload-result: true
          use-annotations: true
          post-pr-comment: true

      - name: Diagnostico 4
        if: always()
        run: |
          R="$RUNNER_TEMP/qodana/results/log"
          grep -E 'class="(OverlyComplexClass|ClassWithTooManyFields|ClassWithTooManyMethods|OverlyComplexMethod)"' "$R/main.profile.xml" || echo "NAO ENCONTRADAS no main.profile.xml"
          grep -c 'enabled="true"' "$R/main.profile.xml"
          grep -n "God Class Profile" "$R/main.profile.xml" | head
          

