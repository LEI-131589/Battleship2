#131589 - Gonçalo Gonçalves
name: Qodana smell gate 131589
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  checks: write
  pull-requests: write
jobs:
  qodana-131589:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Onde esta o ficheiro?
        run: |
          find . -name "GodClassEnorme.java"
          find . -name "pom.xml" -not -path "./node_modules/*"

      - uses: JetBrains/qodana-action@v2026.2
        with:
          args: --config qodana-131589.yaml --print-problems
          pr-mode: false
          upload-result: true
          use-annotations: true
          post-pr-comment: true

      - name: Diagnostico 2
        if: always()
        run: |
          R="$RUNNER_TEMP/qodana/results"
          echo "=== effective.profile.xml ==="
          cat "$R/log/effective.profile.xml"
          echo; echo "=== code-inspection.log ==="
          cat "$R/log/code-inspection.log"
          echo; echo "=== qodana_inspections_summary.csv ==="
          cat "$R/log/qodana_inspections_summary.csv"
          echo; echo "=== qodana.yaml / qodana-config.json ==="
          cat "$R/log/qodana.yaml" "$R/log/qodana-config.json"
          echo; echo "=== as inspecoes existem neste linter? ==="
          grep -oE '"id": *"(OverlyComplexClass|OverlyComplexMethod|ClassWithTooManyFields|ClassWithTooManyMethods)"' "$R/qodana.sarif.json" | sort -u || true
          echo; echo "=== projectStructure ==="
          ls -la "$R/projectStructure"
          echo; echo "=== idea.log: maven / modulos / ficheiros ==="
          grep -iE "maven.*(import|project)|module|source root|GodClass" "$R/log/idea.log" | head -40 || true