#131589 - Gonçalo Gonçalves
name: Qodana smell gate 131589
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  checks: write
  pull-requests: write
jobs:
  qodana-131589:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Onde esta o ficheiro?
        run: |
          find . -name "GodClassEnorme.java"
          find . -name "pom.xml" -not -path "./node_modules/*"

      - uses: JetBrains/qodana-action@v2026.2
        with:
          args: --config qodana-131589.yaml --print-problems
          pr-mode: false
          upload-result: true
          use-annotations: true
          post-pr-comment: true

      - name: Diagnostico
        if: always()
        run: |
          R="$RUNNER_TEMP/qodana/results"
          ls -la "$R" "$R/log"
          echo "--- idea.log (perfil/inspecoes) ---"
          grep -iE "OverlyComplex|ClassWithTooMany|unknown inspection|profile" "$R/log/idea.log" | head -40
          echo "--- regras no sarif ---"
          grep -o '"id": *"[A-Za-z]*"' "$R/qodana.sarif.json" | sort -u | head -50
          echo "--- ocorrencias do ficheiro ---"
          grep -c "GodClassEnorme" "$R/qodana.sarif.json"