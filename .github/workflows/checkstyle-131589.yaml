# 131589 - Gonçalo Gonçalves
name: "Checkstyle Quality Gate 131589"

on:
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  checkstyle-validation:
    name: Checkstyle (convenções de nomes)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Passo 1 - Anotar os erros no código
        uses: dbelyaev/action-checkstyle@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          checkstyle_config: checkstyle-131589.xml
          reporter: github-pr-check
          level: error
          filter_mode: nofilter
        continue-on-error: true

      - name: Passo 2 - Falhar o workflow se houver violações
        run: mvn -B checkstyle:check -Dcheckstyle.config.location=checkstyle-131589.xml -Dcheckstyle.violationSeverity=error