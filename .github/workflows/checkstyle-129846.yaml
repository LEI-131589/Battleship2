# 129846 Inês Marchante
name: "Checkstyle Quality Gate"

on:
  pull_request:
    branches: [ "main" ]

jobs:
  checkstyle-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Passo 1 - Anotar os Erros no Código
        uses: dbelyaev/action-checkstyle@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          checkstyle_config: checkstyle-129846.xml
          reporter: github-pr-check
          filter_mode: nofilter
        continue-on-error: true

      - name: Passo 2 - Chumbar o Workflow (X Vermelho)
        run: mvn checkstyle:check