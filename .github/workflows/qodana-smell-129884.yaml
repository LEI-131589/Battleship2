# 129884 Joana Pires
name: Qodana smell gate 129884

on:
  pull_request:
    branches: [ main, Provocar-Data-Class ]
  push:
    branches: [ main, Provocar-Data-Class ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  qodana:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - uses: JetBrains/qodana-action@v2026.2
        with:
          args: --config qodana-129884.yaml
          use-annotations: true
          post-pr-comment: true