#129846 Inês Marchante
name: Qodana Long Parameter List Gate 129846
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  checks: write
  pull-requests: write
jobs:
  qodana:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: JetBrains/qodana-action@main
        with:
          args: "--config qodana-129846.yaml -l jetbrains/qodana-jvm-community"
          use-annotations: true
          post-pr-comment: true