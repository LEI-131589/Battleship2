 # 129884 Joana Pires
name: Checkstyle Quality Gate 129884

on:
  pull_request:
    branches: [ "main" ]

jobs:
  checkstyle-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Executar Checkstyle
        uses: nikitasavchenko/checkstyle-action@v1.0.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          checkstyle_config: checkstyle-129884.xml